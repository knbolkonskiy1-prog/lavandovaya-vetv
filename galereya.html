<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Галерея — Лавандовая ветвь</title>
  <meta name="description" content="Фото творческого пространства «Лавандовая ветвь» в Перми: зал, камин, настолки, квартирники.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pangolin&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-head" data-sprigs>
      <div class="wrap">
        <span class="hand">загляните к нам</span>
        <h1>Галерея</h1>
        <p>Нажмите на фото, чтобы открыть его на весь экран. Листайте свайпом или стрелками.</p>
      </div>
    </section>

    <section class="section" style="padding-top:24px">
      <div class="wrap">
        <div class="gallery" data-gallery>
          <button type="button" data-full="img/photo-hall-1.jpg"><img src="img/photo-hall-1.jpg" alt="Зал творческого пространства вечером" loading="lazy"></button>
          <button type="button" data-full="img/photo-hall-2.jpg"><img src="img/photo-hall-2.jpg" alt="Зал с гирляндами" loading="lazy"></button>
          <button type="button" data-full="img/photo-fireplace.jpg"><img src="img/photo-fireplace.jpg" alt="Камин" loading="lazy"></button>
          <button type="button" data-full="img/photo-sofas.jpg"><img src="img/photo-sofas.jpg" alt="Диваны и подушки" loading="lazy"></button>
          <button type="button" data-full="img/photo-boardgames.jpg"><img src="img/photo-boardgames.jpg" alt="Полка с настольными играми" loading="lazy"></button>
          <button type="button" data-full="img/photo-counter.jpg"><img src="img/photo-counter.jpg" alt="Стойка администратора" loading="lazy"></button>
          <button type="button" data-full="img/photo-owner-guitar.jpg"><img src="img/photo-owner-guitar.jpg" alt="Хозяйка творческого пространства с гитарой" loading="lazy"></button>
          <button type="button" data-full="img/photo-kvartirnik.jpg"><img src="img/photo-kvartirnik.jpg" alt="Квартирник" loading="lazy"></button>
        </div>
        <p class="center small muted" style="margin-top:16px">Фото с мастер-классов и мероприятий — <span class="todo">[уточнить: добавить, когда хозяйка пришлёт]</span></p>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/main.js"></script>
</body>
</html>
